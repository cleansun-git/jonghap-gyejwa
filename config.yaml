# ============================================================
#  종합계좌 - 계좌별 보유·배당·성과 관리 앱 설정 파일
#  (직접 고쳐도 됩니다. 이 앱은 주문을 계산하지 않으므로 전략 설정이 없습니다.)
#
#  data/overrides.json 이 있으면 그 값이 이 파일보다 우선합니다 (지금은 앱이 이 파일을
#  만들지 않으므로, 직접 만들지 않았다면 신경 쓰지 않아도 됩니다).
#  이 파일을 고친 뒤에는 앱을 다시 켜야 반영됩니다 (클라우드는 flyctl deploy).
# ============================================================

account:
  # 표시용 값들. 계좌 탭은 src/accounts.py 의 ACCOUNTS 에서 나오고, 이 세 값은
  # 앱 전체를 가리키는 이름일 뿐이다.
  code: ALL
  name: 종합계좌

  # 세제 구분. 계좌마다 다르므로(과세이연·비과세·과세) 한 가지로 적지 않는다.
  # 이 앱은 주문이나 세금을 계산하지 않아 동작에 영향이 없다.
  tax: 계좌별 상이

notify:
  # 휴대폰 웹 푸시. 끄면 마감 저장은 그대로 하고 알림만 보내지 않는다.
  # 배포형 기본값은 false 다 — 받은 사람이 원할 때 켜게 한다. true 로 바꾸면 바로 된다.
  # VAPID 키쌍은 처음 켤 때 앱이 스스로 만들어 data/vapid.json 에 넣는다(설치마다 다른 키).
  # 재배포해도 같은 키를 쓰고 싶으면 secrets.json 의 vapid_public/vapid_private 에 적는다.
  push_enabled: false

  # 평일 자동 실행 시각(24시간, KST). 장 마감이 15:30 이라 정리될 때까지 기다려 16시로 둔다.
  daily_hour: 16

  # 분. 같은 KIS 키를 쓰는 다른 앱이 정각에 돈다면 몇 분 띄워 두면 좋다 —
  # KIS 는 접근토큰 발급을 키 하나당 1분에 1번으로 막는다(EGW00133).
  # 이 앱은 기본적으로 KIS 를 쓰지 않으므로 정각이어도 상관없다.
  daily_minute: 5

runtime:
  timezone: Asia/Seoul

  # 시세 출처.  kis = 한국투자증권 오픈API (secrets.json 의 kis_app_key/secret 사용)
  # 이 앱은 모든 계좌가 autoPrice=False 라 KIS 를 호출하지 않는다. 현재가는 화면에서
  # 직접 넣는다. 자기 KIS 키로 자동갱신을 쓰려면 src/accounts.py 를 보라.
  price_source: kis

  log_level: INFO

dashboard:
  # 성과 탭이 불러올 기록 일수. 늘리면 그래프가 길어지는 대신 응답이 조금 느려진다.
  history_days: 180
