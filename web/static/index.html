<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="종합계좌">
<title>종합계좌</title>
<link rel="manifest" href="/static/manifest.json?v=2">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/static/icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 로그인 -->
<div id="login" class="gate hidden">
  <form id="loginForm" class="gate-box">
    <h1>종합계좌</h1>
    <p>비밀번호를 입력하세요</p>
    <input type="password" id="pw" autocomplete="current-password" inputmode="text"
           placeholder="비밀번호" required>
    <button type="submit" class="btn primary">들어가기</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<!-- 본체 -->
<div id="app" class="hidden">

  <header class="top">
    <div>
      <h1 id="topTitle">종합계좌</h1>
      <p class="sub hidden" id="topSub"></p>
    </div>
    <button id="refresh" class="icon-btn" aria-label="새로고침">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <main>
    <!-- 계좌 고르는 줄 + 계좌 화면. 둘 다 app.js 가 만든다.
         계좌가 여섯 개가 되면서 하단 탭에 계좌를 하나씩 놓을 수 없게 됐다 (2026-09-16).
         375px 폰에서 탭 여덟 개면 하나가 47px — "퇴직연금" 네 글자가 안 들어간다.
         그래서 하단은 계좌 / 성과 / 설정 셋만 두고, 계좌는 이 칩 줄에서 고른다.
         칩에 금액을 같이 띄워 전체 현황이 한 화면에 들어오게 했다. -->
    <div id="acctBar" class="acctbar-wrap"></div>

    <!-- 계좌 화면(퇴직연금·ISA·…)은 app.js 가 만든다.
         서버 src/accounts.py 의 등록부를 /api/auth 로 받아 그 수만큼 <section> 을 찍는다.
         IRP·연금저축을 더할 때 이 파일은 손대지 않는다 — 등록부에 한 줄이면 탭까지 생긴다.

         계좌 탭 한 장의 구성 (2026-09-16 체결 탭을 없애고 합친 그대로):
           시세 경고 · KPI · 그룹 표(줄을 누르면 종목 시트) · 버튼 줄 ·
           내일의 전략 · 관리(현금·배당·현재가 직접 입력·운용 시작일·오늘 마감 저장) -->
    <div id="acctTabs"></div>

    <!-- ===== 성과 ===== -->
    <section id="tab-perf" class="tab">
      <!-- 계좌 선택. 맨 앞이 '전체'(모든 계좌 합계)다. -->
      <div class="acctbar names" id="perfSeg"></div>
      <div class="kpis" id="perfKpis"></div>

      <div class="card chart-card">
        <h2>총금액 추이</h2>
        <div id="chartTotal" class="chart"></div>
      </div>

      <div class="card chart-card">
        <h2>평가손익 추이</h2>
        <div id="chartPnl" class="chart"></div>
      </div>

      <div class="card chart-card">
        <h2>월 배당</h2>
        <div id="chartDiv" class="chart"></div>
      </div>

      <div class="card">
        <!-- 한 계좌를 볼 때는 배당시기(월중/월말/기타) 비중, 전체를 볼 때는 계좌별 비중 -->
        <h2 id="mixTitle">그룹별 비중</h2>
        <div id="chartMix"></div>
      </div>
    </section>

    <!-- ===== 설정 ===== -->
    <!-- 설명 문구 없이 (2026-09-13 사용자 요청). 결과 문구는 토스트로 띄운다.
         운용 시작일은 계좌마다 다르므로 각 계좌 탭의 「관리」 안으로 옮겼다 (2026-09-16). -->
    <section id="tab-set" class="tab">
      <div class="card">
        <h2>알림</h2>
        <button id="btnPush" class="btn full">휴대폰 알림 켜기</button>
        <div class="btns2">
          <button id="btnPushTest" class="btn ghost">알림 테스트</button>
          <button id="btnPushDiag" class="btn ghost">안 올 때 진단</button>
        </div>
        <pre id="pushDiag" class="diag hidden"></pre>
      </div>

      <div class="card">
        <h2>현재 설정</h2>
        <div id="cfgList" class="kv"></div>
      </div>

      <div class="card">
        <h2>수동 실행</h2>
        <button id="btnRun" class="btn ghost full">지금 시세 갱신 · 마감 저장</button>
      </div>

      <button id="btnLogout" class="btn ghost full">로그아웃</button>
      <p class="disclaimer">기록·조회용 앱이며 실제 매매를 하지 않습니다.</p>
    </section>
  </main>

  <!-- 탭 버튼도 app.js 가 만든다 (계좌 수 + 성과 + 설정).
       .tabbar 가 grid-auto-columns 라 버튼 수만큼 저절로 나뉜다. -->
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- 종목 시트 — 퇴직연금 탭의 종목 줄과 「종목 추가」 버튼이 이 하나를 돌려 쓴다 -->
<div id="sheet" class="sheet-wrap hidden">
  <div class="sheet-bg"></div>
  <form class="sheet" id="sheetForm">
    <div class="sheet-grip"></div>
    <h2 id="sheetTitle">종목</h2>
    <div class="seg" id="sheetSeg">
      <button type="button" data-a="buy" class="active">매수</button>
      <button type="button" data-a="sell">매도</button>
      <button type="button" data-a="edit">수정</button>
      <button type="button" data-a="remove">삭제</button>
    </div>
    <p class="hint hidden" id="sheetHint"></p>
    <!-- 세그먼트에 따라 보여줄 칸이 다르다. app.js 가 label 의 data-f 로 지목해 켜고 끈다
         (매수·매도는 수량+체결단가만, 수정은 전부, 신규는 종목코드부터).
         칸 이름이 상황에 따라 바뀌는 곳(현재가 ↔ 체결단가)은 .lb 의 글자만 갈아 끼운다. -->
    <div id="sheetFields">
      <label data-f="code"><span class="lb">종목코드</span>
        <input type="text" id="fCode" autocomplete="off" autocapitalize="characters"
               maxlength="6" placeholder="0219E0">
      </label>
      <label data-f="name"><span class="lb">종목명</span>
        <input type="text" id="fName" autocomplete="off" placeholder="KODEX 200커버드콜액티브">
      </label>
      <label data-f="asset"><span class="lb">자산군</span>
        <select id="fAsset">
          <option value="국내주식">국내주식</option>
          <option value="선진국주식">선진국주식</option>
          <option value="국내채권">국내채권</option>
          <option value="해외채권">해외채권</option>
          <option value="금">금</option>
        </select>
      </label>
      <label data-f="pay"><span class="lb">배당 시기</span>
        <select id="fPay">
          <option value="월중">월중</option>
          <option value="월말">월말</option>
          <option value="">기타</option>
        </select>
      </label>
      <label data-f="qty"><span class="lb">수량 (주)</span>
        <input type="number" id="fQty" inputmode="numeric" min="0" step="1">
      </label>
      <label data-f="buyPrice"><span class="lb">매수단가 (원)</span>
        <input type="number" id="fBuyPrice" inputmode="numeric" min="0" step="1">
      </label>
      <label data-f="price"><span class="lb">현재가 (원)</span>
        <input type="number" id="fPrice" inputmode="numeric" min="0" step="1">
      </label>
      <label data-f="memo"><span class="lb">메모</span>
        <input type="text" id="fMemo" autocomplete="off" placeholder="선택 입력">
      </label>
    </div>
    <div class="sheet-btns">
      <button type="button" class="btn ghost" id="sheetCancel">취소</button>
      <button type="submit" class="btn primary" id="sheetSubmit">반영</button>
    </div>
    <p id="sheetErr" class="err"></p>
  </form>
</div>

<div id="toast" class="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
